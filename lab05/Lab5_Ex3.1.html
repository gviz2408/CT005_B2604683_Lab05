<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhiệm vụ 2.2 | Infographic</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f4;
      color: #18332c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 20px;
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
    }

    header { margin-bottom: 28px; }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    header p {
      margin: 0;
      max-width: 65ch;
      line-height: 1.6;
      color: #456158;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.25rem;
    }

    figure { margin: 0; }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #d4dfd9;
      background: #fff;
    }

    .video { margin-top: 36px; }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #14231f;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid #d4dfd9;
      color: #52675f;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body { padding: 28px 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nhiệm vụ 2.2: Infographic</h1>
      <p>Infographic minh họa cho bài tập, kèm video YouTube được giao trong Nhiệm vụ 2.2.</p>
    </header>

    <section aria-labelledby="infographic-title">
      <h2 id="infographic-title">Infographic</h2>
      <figure>
        <img src="Lab05_Ex2.1.png" alt="Infographic của bài tập Lab 05, phần 2.1">
      </figure>
    </section>

    <section class="video" aria-labelledby="video-title">
      <h2 id="video-title">Video bài tập</h2>
      <div class="video-frame">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/fVmRwuScwac?si=StiaC1egRFE0s-xP" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </section>

    <footer>
      © 2026. Nội dung được trình bày phục vụ mục đích học tập; bản quyền hình ảnh và video thuộc về chủ sở hữu tương ứng.
    </footer>
  </main>
</body>
</html>
